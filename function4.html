<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

    // 함수 사용하지 않고 출력

    for(let i=1; i<=3; i++){
        document.write("저의 직업은 웹디자이너입니다<br>")
    }

    for(let j=1; j<=5; j++){
        document.write("저의 직업은 웹퍼블리셔입니다<br>")
    }

    for(let k=1; k<=7; k++){
        document.write("저의 직업은 프런트엔드 개발자 입니다<br>")
    }
    </script>

    <script>

    // 함수를 선언해서 사용
    document.write("<hr>")


    function job(web, count){
        for(let M=1; M<=count; M++){
            document.write("저의 직업은 " + web + "입니다<br>")
        }
    }

    job("웹디자이너", 3)
    job("웹퍼블리셔", 5)
    job("프런트엔드 개발자", 7)

</script>




</body>
</html>
