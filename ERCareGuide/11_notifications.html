<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ER 안심가이드 - 알림</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background-color: #ffffff;
      font-family: "Pretendard", sans-serif;
      color: #0f1e2e;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: 0;
      background-color: transparent;
      font-family: "Pretendard", sans-serif;
    }

    .app {
      width: 100%;
      height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* 상단 네비게이션 */
    .app-bar {
      width: 100%;
      height: 104px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 20px 18px;
      background-color: #ffffff;
    }

    .back-button {
      width: 44px;
      height: 44px;
      position: absolute;
      left: 10px;
      bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .page-title {
      font-size: 22px;
      line-height: 30px;
      font-weight: 700;
      color: #0f1e2e;
    }

    .read-all-button {
      min-width: 96px;
      height: 44px;
      position: absolute;
      right: 12px;
      bottom: 7px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      color: #0d6e7a;
      font-size: 12px;
      line-height: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    /* 알림 분류 탭 */
    .category-tabs {
      width: calc(100% - 40px);
      height: 42px;
      flex-shrink: 0;
      margin: 0 20px;
      display: flex;
      align-items: flex-start;
      border-bottom: 1px solid #dbe3eb;
    }

    .category-button {
      width: 25%;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      color: #71829b;
      font-size: 13px;
      line-height: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .category-button.active {
      border: 1px solid #0083cc;
      color: #0083cc;
      background-color: #ffffff;
    }

    /* 스크롤 영역 */
    .content {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 24px 20px 32px;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    .notification-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 알림 카드 */
    .notification-card {
      width: 100%;
      min-height: 72px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      border: 1px solid #dbe3eb;
      border-radius: 9px;
      background-color: #ffffff;
    }

    .notification-icon-wrap {
      width: 28px;
      height: 40px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notification-icon {
      width: 28px;
      height: 28px;
      display: block;
    }

    .notification-text-area {
      flex: 1;
      min-width: 0;
      margin-left: 12px;
    }

    .notification-title {
      font-size: 14px;
      line-height: 21px;
      font-weight: 500;
      color: #0f1e2e;
    }

    .notification-description {
      margin-top: 2px;
      font-size: 11px;
      line-height: 17px;
      color: #71829b;
      word-break: keep-all;
    }

    .notification-side {
      min-width: 54px;
      flex-shrink: 0;
      margin-left: 8px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: center;
    }

    .notification-time {
      font-size: 12px;
      line-height: 18px;
      color: #71829b;
      white-space: nowrap;
    }

    .unread-dot {
      width: 10px;
      height: 10px;
      margin-top: 8px;
      border-radius: 50%;
      background-color: #ff6b6b;
    }

    /* 공통 하단 탭바 */
    .bottom-tab-bar {
      width: 100%;
      height: 72px;
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      border-top: 1px solid #dbe3eb;
      background-color: #ffffff;
    }

    .tab-item {
      width: 25%;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .tab-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .tab-label {
      font-size: 11px;
      line-height: 14px;
      font-weight: 500;
      color: #71829b;
    }

    .tab-item.active .tab-label {
      color: #0d6e7a;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="app-bar">
      <a
        href="07_home.html"
        class="back-button"
        aria-label="이전 화면으로 이동"
      >
        <img
          src="./icons/back.svg"
          alt=""
          class="back-icon"
        >
      </a>

      <h1 class="page-title">알림</h1>

      <button
        type="button"
        class="read-all-button"
      >
        모두 읽음으로 표시
      </button>
    </header>

    <div class="category-tabs" aria-label="알림 분류">
      <button
        type="button"
        class="category-button active"
      >
        전체
      </button>

      <button
        type="button"
        class="category-button"
      >
        중요
      </button>

      <button
        type="button"
        class="category-button"
      >
        예약·진료
      </button>

      <button
        type="button"
        class="category-button"
      >
        기타
      </button>
    </div>

    <section class="content">

      <div class="notification-list">

        <a
          href="12_notification_detail.html"
          class="notification-card"
        >
          <div class="notification-icon-wrap">
            <img
              src="./icons/bell_red.svg"
              alt=""
              class="notification-icon"
            >
          </div>

          <div class="notification-text-area">
            <h2 class="notification-title">
              예진 순서가 곧 다가옵니다.
            </h2>

            <p class="notification-description">
              현재 12번째 / 예진 대기중
            </p>
          </div>

          <div class="notification-side">
            <time class="notification-time">09:35</time>
            <span class="unread-dot"></span>
          </div>
        </a>

        <a
          href="12_notification_detail.html"
          class="notification-card"
        >
          <div class="notification-icon-wrap">
            <img
              src="./icons/flask_red.svg"
              alt=""
              class="notification-icon"
            >
          </div>

          <div class="notification-text-area">
            <h2 class="notification-title">
              검사 결과가 준비 되었어요.
            </h2>

            <p class="notification-description">
              결과 확인이 가능합니다.
            </p>
          </div>

          <div class="notification-side">
            <time class="notification-time">09:10</time>
            <span class="unread-dot"></span>
          </div>
        </a>

        <a
          href="12_notification_detail.html"
          class="notification-card"
        >
          <div class="notification-icon-wrap">
            <img
              src="./icons/check_green_active_b.svg"
              alt=""
              class="notification-icon"
            >
          </div>

          <div class="notification-text-area">
            <h2 class="notification-title">
              접수 완료 안내
            </h2>

            <p class="notification-description">
              접수가 정상적으로 완료 되었어요.
            </p>
          </div>

          <div class="notification-side">
            <time class="notification-time">08:50</time>
          </div>
        </a>

        <a
          href="12_notification_detail.html"
          class="notification-card"
        >
          <div class="notification-icon-wrap">
            <img
              src="./icons/calendar.svg"
              alt=""
              class="notification-icon"
            >
          </div>

          <div class="notification-text-area">
            <h2 class="notification-title">
              예약 변경 안내
            </h2>

            <p class="notification-description">
              예약 일정이 변경되었습니다.
            </p>
          </div>

          <div class="notification-side">
            <time class="notification-time">어제 16:20</time>
          </div>
        </a>

        <a
          href="12_notification_detail.html"
          class="notification-card"
        >
          <div class="notification-icon-wrap">
            <img
              src="./icons/parking_line.svg"
              alt=""
              class="notification-icon"
            >
          </div>

          <div class="notification-text-area">
            <h2 class="notification-title">
              주차 정산 안내
            </h2>

            <p class="notification-description">
              주차 정산이 완료 되었습니다.
            </p>
          </div>

          <div class="notification-side">
            <time class="notification-time">어제 15:05</time>
          </div>
        </a>

      </div>

    </section>

    <nav class="bottom-tab-bar" aria-label="하단 메뉴">

      <a
        href="07_home.html"
        class="tab-item"
      >
        <img
          src="./icons/tap_home.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">홈</span>
      </a>

      <a
        href="09_progress_status.html"
        class="tab-item"
      >
        <img
          src="./icons/tap_check.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">진행상황</span>
      </a>

      <a
        href="11_notifications.html"
        class="tab-item active"
      >
        <img
          src="./icons/tap_bell_active.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">알림</span>
      </a>

      <a
        href="17_more.html"
        class="tab-item"
      >
        <img
          src="./icons/tap_menu.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">더보기</span>
      </a>

    </nav>

  </main>
</body>
</html>
