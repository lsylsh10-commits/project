<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ER 안심가이드 - FAQ</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background-color: #ffffff;
      font-family: "Pretendard", sans-serif;
      color: #0f1e2e;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input {
      border: 0;
      font-family: "Pretendard", sans-serif;
    }

    .app {
      width: 100%;
      height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* 상단 네비게이션 */
    .app-bar {
      width: 100%;
      height: 112px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 20px 24px;
      background-color: #ffffff;
    }

    .back-button {
      width: 44px;
      height: 44px;
      position: absolute;
      left: 10px;
      bottom: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .page-title {
      font-size: 22px;
      line-height: 30px;
      font-weight: 700;
      color: #0f1e2e;
    }

    /* 스크롤 영역 */
    .content {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 20px 32px;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    /* 검색창 */
    .search-box {
      width: 100%;
      height: 54px;
      position: relative;
    }

    .search-input {
      width: 100%;
      height: 54px;
      padding: 0 52px 0 20px;
      border: 1px solid #dbe3eb;
      border-radius: 9px;
      outline: none;
      background-color: #ffffff;
      color: #0f1e2e;
      font-size: 14px;
    }

    .search-input::placeholder {
      color: #aebaca;
    }

    .search-input:focus {
      border-color: #0083cc;
    }

    .search-button {
      width: 44px;
      height: 44px;
      position: absolute;
      top: 5px;
      right: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: transparent;
      cursor: pointer;
    }

    .search-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    /* 공통 섹션 */
    .section {
      width: 100%;
      margin-top: 18px;
    }

    .section-title {
      font-size: 18px;
      line-height: 26px;
      font-weight: 700;
      color: #0f1e2e;
    }

    /* 추천 검색어 */
    .keyword-list {
      width: 100%;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .keyword-button {
      flex: 1;
      height: 26px;
      padding: 0 10px;
      border: 1px solid #dbe3eb;
      border-radius: 999px;
      background-color: #f2f6fa;
      color: #64748b;
      font-size: 12px;
      line-height: 18px;
      white-space: nowrap;
      cursor: pointer;
    }

    /* 바로가기 카드 */
    .shortcut-grid {
      width: 100%;
      margin-top: 10px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .shortcut-card {
      width: 100%;
      height: 96px;
      padding: 16px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #dbe3eb;
      border-radius: 9px;
      background-color: #ffffff;
    }

    .shortcut-text {
      flex: 1;
      min-width: 0;
    }

    .shortcut-title {
      font-size: 14px;
      line-height: 21px;
      font-weight: 700;
      color: #0083cc;
    }

    .shortcut-description {
      margin-top: 6px;
      font-size: 11px;
      line-height: 17px;
      color: #71829b;
      word-break: keep-all;
    }

    .shortcut-icon {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      margin-left: 8px;
      display: block;
    }

    /* 인기 정보 */
    .popular-list {
      width: 100%;
      margin-top: 10px;
      border: 1px solid #dbe3eb;
      border-radius: 9px;
      overflow: hidden;
      background-color: #ffffff;
    }

    .popular-item {
      width: 100%;
      min-height: 36px;
      padding: 0 14px;
      display: flex;
      align-items: center;
    }

    .popular-item + .popular-item {
      border-top: 1px solid #dbe3eb;
    }

    .popular-text {
      flex: 1;
      font-size: 12px;
      line-height: 18px;
      color: #71829b;
    }

    .next-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      display: block;
    }

    /* 하단 탭바 */
    .bottom-tab-bar {
      width: 100%;
      height: 72px;
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      border-top: 1px solid #dbe3eb;
      background-color: #ffffff;
    }

    .tab-item {
      width: 25%;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .tab-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .tab-label {
      font-size: 11px;
      line-height: 14px;
      font-weight: 500;
      color: #71829b;
    }

    .tab-item.active .tab-label {
      color: #0d6e7a;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="app-bar">
      <a
        href="17_more.html"
        class="back-button"
        aria-label="이전 화면으로 이동"
      >
        <img
          src="./icons/back.svg"
          alt=""
          class="back-icon"
        >
      </a>

      <h1 class="page-title">FAQ</h1>
    </header>

    <section class="content">

      <div class="search-box">
        <input
          type="search"
          class="search-input"
          placeholder="궁금한 정보를 검색해 보세요"
          aria-label="FAQ 검색"
        >

        <button
          type="button"
          class="search-button"
          aria-label="검색"
        >
          <img
            src="./icons/search.svg"
            alt=""
            class="search-icon"
          >
        </button>
      </div>

      <section class="section">
        <h2 class="section-title">추천 검색어</h2>

        <div class="keyword-list">
          <button type="button" class="keyword-button">수납</button>
          <button type="button" class="keyword-button">주차</button>
          <button type="button" class="keyword-button">검사결과</button>
          <button type="button" class="keyword-button">면회</button>
          <button type="button" class="keyword-button">진료비</button>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">바로가기</h2>

        <div class="shortcut-grid">

          <a
            href="15_hospital_use_guide.html"
            class="shortcut-card"
          >
            <div class="shortcut-text">
              <h3 class="shortcut-title">병원 절차</h3>
              <p class="shortcut-description">
                진료 절차와<br>
                이용 방법 안내
              </p>
            </div>

            <img
              src="./icons/faqicon1.svg"
              alt=""
              class="shortcut-icon"
            >
          </a>

          <a
            href="14_tests_and_treatment.html"
            class="shortcut-card"
          >
            <div class="shortcut-text">
              <h3 class="shortcut-title">검사 안내</h3>
              <p class="shortcut-description">
                검사 종류와<br>
                준비 사항 확인
              </p>
            </div>

            <img
              src="./icons/faqicon2.svg"
              alt=""
              class="shortcut-icon"
            >
          </a>

          <div class="shortcut-card">
            <div class="shortcut-text">
              <h3 class="shortcut-title">FAQ</h3>
              <p class="shortcut-description">
                자주 묻는 질문을<br>
                확인해 보세요.
              </p>
            </div>

            <img
              src="./icons/faqicon3.svg"
              alt=""
              class="shortcut-icon"
            >
          </div>

          <a
            href="16_location_guide.html"
            class="shortcut-card"
          >
            <div class="shortcut-text">
              <h3 class="shortcut-title">위치안내</h3>
              <p class="shortcut-description">
                진료실 및 시설<br>
                위치 확인
              </p>
            </div>

            <img
              src="./icons/faqicon4.svg"
              alt=""
              class="shortcut-icon"
            >
          </a>

        </div>
      </section>

      <section class="section">
        <h2 class="section-title">인기 정보</h2>

        <div class="popular-list">

          <div class="popular-item">
            <span class="popular-text">면회 및 출입 안내</span>
            <img src="./icons/next.svg" alt="" class="next-icon">
          </div>

          <div class="popular-item">
            <span class="popular-text">진료비 수납 방법</span>
            <img src="./icons/next.svg" alt="" class="next-icon">
          </div>

          <div class="popular-item">
            <span class="popular-text">주차 요금 및 정산 안내</span>
            <img src="./icons/next.svg" alt="" class="next-icon">
          </div>

          <div class="popular-item">
            <span class="popular-text">검사 결과 확인 방법</span>
            <img src="./icons/next.svg" alt="" class="next-icon">
          </div>

        </div>
      </section>

    </section>

    <nav class="bottom-tab-bar" aria-label="하단 메뉴">

      <a href="07_home.html" class="tab-item">
        <img src="./icons/tap_home.svg" alt="" class="tab-icon">
        <span class="tab-label">홈</span>
      </a>

      <a href="09_progress_status.html" class="tab-item">
        <img src="./icons/tap_check.svg" alt="" class="tab-icon">
        <span class="tab-label">진행상황</span>
      </a>

      <a href="11_notifications.html" class="tab-item">
        <img src="./icons/tap_bell.svg" alt="" class="tab-icon">
        <span class="tab-label">알림</span>
      </a>

      <a href="17_more.html" class="tab-item active">
        <img src="./icons/tap_menu_active.svg" alt="" class="tab-icon">
        <span class="tab-label">더보기</span>
      </a>

    </nav>

  </main>
</body>
</html>
