<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ER 안심가이드 - 온보딩 2</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background-color: #ffffff;
      font-family: "Pretendard", sans-serif;
      color: #0f1e2e;
    }

    .app {
      width: 100%;
      height: 100svh;
      overflow: hidden;
      background-color: #ffffff;
    }

    .onboarding {
      width: 100%;
      height: 100%;
      padding: 64px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .indicator {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: 16px;
      margin-bottom: 76px;
    }

    .indicator span {
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #e2e8f0;
    }

    .indicator .active {
      background-color: #0d6e7a;
    }

    .text-area {
      width: 100%;
      text-align: center;
    }

    .title {
      font-size: 22px;
      line-height: 30px;
      font-weight: 700;
      color: #0f1e2e;
      word-break: keep-all;
    }

    .description {
      margin-top: 18px;
      font-size: 14px;
      line-height: 22px;
      font-weight: 400;
      color: #64748b;
      word-break: keep-all;
    }

    .waiting-card {
      width: 250px;
      margin-top: 78px;
      padding: 24px 20px 22px;
      border: 1px solid #dbe3eb;
      border-radius: 10px;
      background-color: #ffffff;
    }

    .card-title {
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
      text-align: center;
      color: #0f1e2e;
    }

    .waiting-time {
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .time-icon {
      width: 40px;
      height: 40px;
      display: block;
    }

    .time-text {
      font-size: 25px;
      line-height: 34px;
      font-weight: 700;
      color: #0f1e2e;
    }

    .update-time {
      margin-top: 6px;
      font-size: 12px;
      line-height: 18px;
      text-align: center;
      color: #64748b;
    }

    .divider {
      width: 100%;
      height: 1px;
      margin: 16px 0 20px;
      border: 0;
      background-color: #dbe3eb;
    }

    .delay-title {
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
      color: #0f1e2e;
    }

    .delay-description {
      margin-top: 8px;
      font-size: 13px;
      line-height: 21px;
      color: #64748b;
      word-break: keep-all;
    }

    .button-area {
      width: 100%;
      margin-top: auto;
    }

    .next-button {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background-color: #0d7c87;
      color: #ffffff;
      font-size: 16px;
      line-height: 20px;
      font-weight: 600;
      text-decoration: none;
    }

    .skip-button {
      width: 100%;
      min-height: 44px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 15px;
      line-height: 20px;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="onboarding">
      <div class="indicator" aria-label="온보딩 2단계">
        <span></span>
        <span class="active"></span>
        <span></span>
      </div>

      <div class="text-area">
        <h1 class="title">
          예상 대기시간과<br>
          지연 사유를 안내해드려요
        </h1>

        <p class="description">
          예상 대기시간과 지연 사유를 알려드려<br>
          마음을 편안하게 도와드려요.
        </p>
      </div>

      <section class="waiting-card">
        <h2 class="card-title">예상 대기시간</h2>

        <div class="waiting-time">
          <img
            src="./icons/time_green.svg"
            alt="대기시간"
            class="time-icon"
          >

          <p class="time-text">1시간 25분</p>
        </div>

        <p class="update-time">업데이트 09:41</p>

        <hr class="divider">

        <h3 class="delay-title">지연 사유</h3>

        <p class="delay-description">
          응급 환자 발생 증가로 인해<br>
          대기시간이 길어지고 있어요.
        </p>
      </section>

      <div class="button-area">
        <a href="04_onboarding3.html" class="next-button">
          다음
        </a>

        <a href="05_login.html" class="skip-button">
          건너뛰기
        </a>
      </div>
    </section>
  </main>

  <script>
    setTimeout(function () {
      location.href = "04_onboarding3.html";
    }, 3000);
  </script>
</body>
</html>
