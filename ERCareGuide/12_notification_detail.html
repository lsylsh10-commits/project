<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ER 안심가이드 - 알림 상세</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background-color: #ffffff;
      font-family: "Pretendard", sans-serif;
      color: #0f1e2e;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      border: 0;
      font-family: "Pretendard", sans-serif;
      cursor: pointer;
    }

    .app {
      width: 100%;
      height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* 상단 네비게이션 */
    .app-bar {
      width: 100%;
      height: 112px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 20px 24px;
      background-color: #ffffff;
    }

    .back-button {
      width: 44px;
      height: 44px;
      position: absolute;
      left: 10px;
      bottom: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .page-title {
      font-size: 22px;
      line-height: 30px;
      font-weight: 700;
      color: #0f1e2e;
    }

    /* 스크롤 영역 */
    .content {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 20px 12px;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    .content-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 공통 카드 */
    .card {
      width: 100%;
      border: 1px solid #dbe3eb;
      border-radius: 9px;
      background-color: #ffffff;
    }

    /* 알림 요약 카드 */
    .summary-card {
      padding: 16px;
    }

    .important-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 14px;
      border: 1px solid #ff6b6b;
      border-radius: 8px;
      background-color: #fff2f2;
      color: #ff6b6b;
      font-size: 13px;
      line-height: 20px;
      font-weight: 600;
    }

    .notification-title {
      margin-top: 16px;
      font-size: 18px;
      line-height: 26px;
      font-weight: 700;
      color: #0f1e2e;
    }

    .summary-info {
      width: 100%;
      margin-top: 18px;
      display: flex;
      align-items: stretch;
    }

    .summary-column {
      width: 50%;
      padding: 0 10px;
    }

    .summary-column:first-child {
      padding-left: 10px;
      border-right: 1px solid #dbe3eb;
    }

    .summary-label {
      font-size: 11px;
      line-height: 17px;
      color: #71829b;
    }

    .summary-value {
      margin-top: 2px;
      font-size: 12px;
      line-height: 18px;
      color: #71829b;
      white-space: nowrap;
    }

    /* 상세 카드 */
    .detail-card {
      padding: 18px 22px;
    }

    .card-title {
      font-size: 18px;
      line-height: 26px;
      font-weight: 700;
      color: #0f1e2e;
    }

    .detail-text {
      margin-top: 20px;
      font-size: 13px;
      line-height: 22px;
      color: #71829b;
      word-break: keep-all;
    }

    .detail-text + .detail-text {
      margin-top: 14px;
    }

    .divider {
      width: 100%;
      height: 1px;
      margin: 18px 0;
      border: 0;
      background-color: #dbe3eb;
    }

    .warning-area {
      display: flex;
      align-items: flex-start;
    }

    .warning-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: block;
    }

    .warning-content {
      flex: 1;
      min-width: 0;
      margin-left: 14px;
    }

    .warning-title {
      font-size: 14px;
      line-height: 21px;
      font-weight: 500;
      color: #71829b;
    }

    .warning-list {
      margin-top: 6px;
      padding-left: 16px;
      color: #71829b;
    }

    .warning-list li {
      font-size: 13px;
      line-height: 21px;
      word-break: keep-all;
    }

    /* 버튼 */
    .button-area {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .primary-button {
      width: 100%;
      height: 32px;
      border-radius: 8px;
      background-color: #117d88;
      color: #ffffff;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
    }

    .secondary-button {
      width: 100%;
      height: 32px;
      border: 1px solid #dbe3eb;
      border-radius: 8px;
      background-color: #ffffff;
      color: #71829b;
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
    }

    /* 공통 하단 탭바 */
    .bottom-tab-bar {
      width: 100%;
      height: 72px;
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      border-top: 1px solid #dbe3eb;
      background-color: #ffffff;
    }

    .tab-item {
      width: 25%;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .tab-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .tab-label {
      font-size: 11px;
      line-height: 14px;
      font-weight: 500;
      color: #71829b;
    }

    .tab-item.active .tab-label {
      color: #0d6e7a;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="app-bar">
      <a
        href="11_notifications.html"
        class="back-button"
        aria-label="알림 목록으로 이동"
      >
        <img
          src="./icons/back.svg"
          alt=""
          class="back-icon"
        >
      </a>

      <h1 class="page-title">알림 상세</h1>
    </header>

    <section class="content">

      <div class="content-list">

        <section class="card summary-card">
          <span class="important-badge">중요</span>

          <h2 class="notification-title">
            예진 순서가 곧 다가옵니다.
          </h2>

          <div class="summary-info">

            <div class="summary-column">
              <p class="summary-label">발생 시간</p>
              <p class="summary-value">2024.05.01 (수) 09:35</p>
            </div>

            <div class="summary-column">
              <p class="summary-label">관련 진료 단계</p>
              <p class="summary-value">예진 대기</p>
            </div>

          </div>
        </section>

        <section class="card detail-card">
          <h2 class="card-title">상세 내용</h2>

          <p class="detail-text">
            현재 12번째로 예진 순서가<br>
            약 10분 후 도래할 예정이에요.
          </p>

          <p class="detail-text">
            호출 시 알림과 화면으로 안내드릴게요.<br>
            검사실로 이동해 기다려 주세요.
          </p>

          <hr class="divider">

          <div class="warning-area">
            <img
              src="./icons/warning.svg"
              alt=""
              class="warning-icon"
            >

            <div class="warning-content">
              <h3 class="warning-title">유의 사항</h3>

              <ul class="warning-list">
                <li>
                  호출 후 5분 내 미응답 시 순서가 뒤로<br>
                  이동할 수 있어요.
                </li>

                <li>
                  대기 의자 및 지정된 장소에서 안전하게<br>
                  대기해 주세요.
                </li>
              </ul>
            </div>
          </div>
        </section>

        <div class="button-area">
          <button
            type="button"
            class="primary-button"
          >
            해야 할 일 확인하기
          </button>

          <button
            type="button"
            class="secondary-button"
          >
            확인했어요
          </button>
        </div>

      </div>

    </section>

    <nav class="bottom-tab-bar" aria-label="하단 메뉴">

      <a
        href="07_home.html"
        class="tab-item"
      >
        <img
          src="./icons/tap_home.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">홈</span>
      </a>

      <a
        href="09_progress_status.html"
        class="tab-item"
      >
        <img
          src="./icons/tap_check.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">진행상황</span>
      </a>

      <a
        href="11_notifications.html"
        class="tab-item active"
      >
        <img
          src="./icons/tap_bell_active.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">알림</span>
      </a>

      <a
        href="17_more.html"
        class="tab-item"
      >
        <img
          src="./icons/tap_menu.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">더보기</span>
      </a>

    </nav>

  </main>
</body>
</html>
