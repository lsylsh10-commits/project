<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" href="./css/styleai.css">
</head>
<body>

    <div class="login-wrap">

        <div class="login-box">

            <h1>로그인</h1>

            <form>
                <div class="input-box">
                    <label for="user-id">아이디</label>
                    <input type="text" id="user-id">
                </div>

                <div class="input-box">
                    <label for="user-pw">비밀번호</label>
                    <input type="password" id="user-pw">
                </div>

                <button type="submit">로그인</button>
            </form>

        </div>

    </div>

</body>
</html>
