<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Camba Splash</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 812px;
        }

        body {
            background-color: #ffffff;
        }

        .splash {
            position: relative;
            width: 100%;
            height: 812px;
            overflow: hidden;
            background-color: #ffffff;
        }

        .logo {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 150px;
            transform: translate(-50%, -50%);
        }

        .logo img {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>
    <div class="splash">
        <div class="logo">
            <img src="./images/logo.svg" alt="camba 로고">
        </div>
    </div>
<script>
  setTimeout(function () {
    window.location.href = "onboard1.html";
  }, 3000);
</script>
</body>
</html>
