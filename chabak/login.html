<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Cambak 로그인</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 812px;
        }

        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .login-page {
            position: relative;
            width: 100%;
            height: 812px;
            overflow: hidden;
            background-color: #ffffff;
        }

        .logo-area {
            position: absolute;
            top: 102px;
            left: 50%;
            width: 130px;
            transform: translateX(-50%);
        }

        .logo-area img {
            display: block;
            width: 100%;
            height: auto;
        }

        .login-form {
            position: absolute;
            top: 247px;
            left: 24px;
            width: calc(100% - 48px);
        }

        .input-box {
            width: 100%;
            height: 72px;
            border-bottom: 1px solid #d8d8d8;
        }

        .password-box {
            margin-top: 12px;
        }

        .input-box label {
            display: block;
            color: #4969b4;
            font-size: 15px;
            font-weight: 500;
        }

        .input-box input {
            display: block;
            width: 100%;
            height: 45px;
            padding-top: 8px;
            border: 0;
            outline: 0;
            background-color: transparent;
            color: #222222;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        .input-box input::placeholder {
            color: #bbbbbb;
        }

        .button-area {
            margin-top: 32px;
        }

        .login-button,
        .join-button {
            display: block;
            width: 100%;
            height: 49px;
            border-radius: 12px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        .login-button {
            border: 0;
            background-color: #5675bb;
            color: #ffffff;
        }

        .join-button {
            margin-top: 8px;
            border: 1px solid #5675bb;
            background-color: #ffffff;
            color: #5675bb;
        }

        .account-menu {
            margin-top: 15px;
            text-align: center;
            color: #435d98;
            font-size: 13px;
        }

        .account-menu a {
            color: #435d98;
            text-decoration: none;
        }

        .account-menu span {
            margin: 0 11px;
            color: #a9b3ca;
        }

        .simple-login {
            margin-top: 34px;
        }

        .simple-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;
            color: #4863a0;
            font-size: 13px;
        }

        .simple-title::before,
        .simple-title::after {
            content: "";
            width: 120px;
            height: 1px;
            background-color: #7590c8;
        }

        .social-list {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 32px;
            margin-top: 26px;
        }

        .social-list a {
            display: block;
            width: 24px;
            height: 24px;
        }

        .social-list img {
            display: block;
            width: 24px;
            height: 24px;
            object-fit: contain;
        }
    </style>
</head>

<body>
    <div class="login-page">

        <div class="logo-area">
            <img src="./images/logo.svg" alt="cambak 로고">
        </div>

        <form class="login-form">

            <div class="input-box">
                <label for="user-id">아이디</label>

                <input
                    type="text"
                    id="user-id"
                    name="user-id"
                    placeholder="아이디를 입력해주세요"
                >
            </div>

            <div class="input-box password-box">
                <label for="user-password">비밀번호</label>

                <input
                    type="password"
                    id="user-password"
                    name="user-password"
                    placeholder="비밀번호를 입력해주세요"
                >
            </div>

            <div class="button-area">
                <button type="submit" class="login-button">
                    로그인
                </button>

                <button type="button" class="join-button">
                    회원가입
                </button>
            </div>

            <div class="account-menu">
                <a href="#">아이디 찾기</a>
                <span>|</span>
                <a href="#">비밀번호 찾기</a>
                <span>|</span>
                <a href="#">둘러보기</a>
            </div>

            <div class="simple-login">
                <div class="simple-title">
                    간편로그인
                </div>

                <div class="social-list">
                    <a href="#">
                        <img src="./images/kakao.png" alt="카카오 로그인">
                    </a>

                    <a href="#">
                        <img src="./images/naver.png" alt="네이버 로그인">
                    </a>

                    <a href="#">
                        <img src="./images/google.png" alt="구글 로그인">
                    </a>

                    <a href="#">
                        <img src="./images/facebook.png" alt="페이스북 로그인">
                    </a>
                </div>
            </div>

        </form>

    </div>
</body>
</html>
