<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Camba 온보딩 3</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 812px;
        }

        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .onboarding {
            position: relative;
            width: 100%;
            height: 812px;
            overflow: hidden;
            background-color: #ffffff;
        }

        .text-area {
            position: absolute;
            top: 101px;
            left: 24px;
            width: calc(100% - 48px);
        }

        .title {
            font-size: 28px;
            line-height: 1.4;
            font-weight: 700;
            letter-spacing: -1.5px;
            color: #354b7f;
        }

        .title-small {
            display: block;
            font-size: 22px;
            font-weight: 600;
            color: #7188c4;
        }

        .title-light {
            color: #7188c4;
        }

        .description {
            margin-top: 20px;
            font-size: 17px;
            line-height: 1.55;
            font-weight: 500;
            letter-spacing: -0.8px;
            color: #9badd8;
        }

        .visual-area {
            position: absolute;
            top: 348px;
            left: 0;
            width: 100%;
            height: 285px;
            overflow: hidden;
        }

        .visual-background {
            position: absolute;
            top: 24px;
            left: -120px;
            width: 430px;
            height: 210px;
            background-color: #f0f3fa;
            border-radius: 0 55% 55% 0;
            transform: rotate(8deg);
        }

        .visual-area img {
            position: relative;
            z-index: 1;
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center;
        }

        .pagination {
            position: absolute;
            top: 664px;
            left: 50%;
            display: flex;
            align-items: center;
            gap: 16px;
            transform: translateX(-50%);
        }

        .pagination span {
            display: block;
            width: 10px;
            height: 10px;
            background-color: #edf0f8;
            border-radius: 50%;
        }

        .pagination .active {
            background-color: #5876bd;
        }

        .start-button {
            position: absolute;
            left: 24px;
            bottom: 34px;
            width: calc(100% - 48px);
            height: 49px;
            border: 0;
            border-radius: 12px;
            background-color: #5674b9;
            color: #ffffff;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>
    <div class="onboarding">

        <div class="text-area">
            <h1 class="title">
                <span class="title-small">일상이 바쁠땐 실시간</span>
                라이브로 대리만족 <span class="title-light">하세요</span>
            </h1>

            <p class="description">
                라이브로 나를 뽐내고 시청자들과 소통하는 즐거움!
            </p>
        </div>

        <div class="visual-area">
            <div class="visual-background"></div>

            <img
                src="./images/work3ill.svg"
                alt="모닥불 앞에서 라이브 방송을 하는 곰 캐릭터"
            >
        </div>

        <div class="pagination">
            <span></span>
            <span></span>
            <span class="active"></span>
        </div>

        <a href="./login.html"><button type="button" class="start-button">
            시작하기
        </button></a>

    </div>
    <script>
  setTimeout(function () {
    window.location.href = "login.html";
  }, 3000);
  </script>
</body>
</html>
