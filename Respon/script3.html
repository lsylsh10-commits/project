<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자바스크립트3</title>
    <style>
        h1{color: green;}
        p{background-color: pink;}
        h2{color: red; background-color: yellow;}
    </style>
</head>
<body>
    <h1>이 문서에서 가장 큰 제목입니다</h1>
    <p>여기는 이 페이지에 첫번째 문단입니다</p>
    <script>
        document.write("<h2>이 문서의 두번째 제목입니다</h2>");
    </script>
</body>
</html>
