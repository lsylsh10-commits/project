<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>배열 응용</title>
</head>
<body>

    <script>
        let member = [
            "김세정",
            "전소미",
            "청하",
            "주결경",
            "김소혜",
            "정채연",
            "강미나",
            "최유정",
            "김도연",
            "임나영",
            "연정"
        ];

        document.write(`I.O.I 멤버는 ${member}입니다<br><hr>`);

        for(let i = 0; i < member.length; i++){
            document.write(`${member[i]}<br>`);
        }

        document.write(`<hr>`);

        document.write(`멤버 중 솔로로 데뷔한 멤버는 ${member[0]}입니다<br>`);
        document.write(`멤버 중 솔로로 데뷔한 멤버는 ${member[2]}입니다<br>`);
        document.write(`멤버 중 솔로로 데뷔한 멤버는 ${member[1]}입니다<br>`);

        document.write(`<hr>`);

    </script>

</body>
</html>
