<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스 모델</title>

    <style>
        * {
            padding: 0;
            margin: 0;
        }

        .parent {
            width: 1000px;
            height: 500px;
            margin: 5px auto;
            border: 4px solid blue;
            display: flex;
            gap: 20px;
        }

        .child {
            width: 300px;
            height: 200px;
            border: 4px solid black;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="child">배너1</div>
        <div class="child">배너2</div>
        <div class="child">배너3</div>
    </div>
</body>
</html>
