<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체 데이터 응용</title>
</head>
<body>
    <script>

    let book = [
        "미드나잇 라이브러리",
        "매트 헤이그",
        "14,220원",
        "2021-04-28",
        "408",
        "9791191056556(1191056554)"
    ]

    document.write(`책 제목 : ${book[0]}<br>`)
    document.write(`저자 : ${book[1]}<br>`)
    document.write(`가격 : ${book[2]}<br>`)
    document.write(`출간일 : ${book[3]}<br>`)
    document.write(`페이지 수 : ${book[4]}<br>`)
    document.write(`ISBN : ${book[5]}<br>`)

    document.write('<hr>')


    let book2 = [
        "미드나잇 라이브러리",
        "매트 헤이그",
        "14,220원",
        "2021-04-28",
        "408",
        "9791191056556(1191056554)"
    ]

    let bookName = [
        "책 제목",
        "저자",
        "가격",
        "출간일",
        "페이지 수",
        "ISBN"
    ]

    for(let i=0; i<book2.length; i++){
        document.write(`${bookName[i]} : ${book2[i]}<br>`)
    }

    document.write('<hr>')


    let book3 = {
        title:"미드나잇 라이브러리",
        writer:"매트 헤이그",
        price:"14,220원",
        date:"2021-04-28",
        page:"408",
        isbn:"9791191056556(1191056554)"
    }

    document.write(`책 제목 : ${book3.title}<br>`)
    document.write(`저자 : ${book3.writer}<br>`)
    document.write(`가격 : ${book3.price}<br>`)
    document.write(`출간일 : ${book3.date}<br>`)
    document.write(`페이지 수 : ${book3.page}<br>`)
    document.write(`ISBN : ${book3.isbn}<br>`)

    document.write('<hr>')


    let book4 = {
        "책 제목":"미드나잇 라이브러리",
        "저자":"매트 헤이그",
        "가격":"14,220원",
        "출간일":"2021-04-28",
        "페이지 수":"408",
        "ISBN":"9791191056556(1191056554)"
    }

    for(let key in book4){
        document.write(`${key} : ${book4[key]}<br>`)
    }

    document.write('<hr>')

</script>

</body>
</html>
