<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>캠핑 장소 검색</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, "Noto Sans KR", sans-serif;
            color: #171717;
            background-color: #ffffff;
        }

        body {
            overflow-x: hidden;
        }

        button,
        a {
            font: inherit;
        }

        button {
            border: none;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .app {
            width: 100%;
            min-height: 100svh;
            background-color: #ffffff;
        }

        /* =========================
           검색 결과 화면
        ========================= */

        .search-screen {
            width: 100%;
            min-height: 100svh;
            padding-bottom: 76px;
            background-color: #ffffff;
        }

        .search-screen.hidden {
            display: none;
        }

        /* 상단 네비게이션 */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 50;
            width: 100%;
            height: 80px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 0 24px 15px;
            background-color: #ffffff;
            border-bottom: 1px solid #eeeeee;
        }

        .back-button {
            position: absolute;
            left: 24px;
            bottom: 14px;
            width: 30px;
            height: 30px;
            background-color: transparent;
            color: #111111;
            font-size: 31px;
            font-weight: 300;
            line-height: 30px;
            cursor: pointer;
        }

        .page-title {
            font-size: 18px;
            font-weight: 500;
        }

        /* 검색 목록 */
        .place-list {
            width: 100%;
            list-style: none;
        }

        .place-item {
            width: 100%;
            border-bottom: 1px solid #eeeeee;
        }

        .place-button {
            width: 100%;
            min-height: 148px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 24px;
            background-color: #ffffff;
            text-align: left;
            cursor: pointer;
        }

        .place-button:active {
            background-color: #f7f8fb;
        }

        .place-image {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
        }

        .place-information {
            flex: 1;
            min-width: 0;
            min-height: 100px;
            display: flex;
            flex-direction: column;
        }

        .place-name-row {
            width: 100%;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .place-name {
            flex: 1;
            min-width: 0;
            font-size: 17px;
            font-weight: 500;
            line-height: 1.3;
            word-break: keep-all;
        }

        .save-icon {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .place-address {
            margin-top: 3px;
            padding-right: 8px;
            color: #222222;
            font-size: 13px;
            line-height: 1.4;
            word-break: keep-all;
        }

        .place-bottom {
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 8px;
            margin-top: auto;
        }

        .tag-area {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 5px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 25px;
            padding: 0 9px;
            border-radius: 8px;
            background-color: #5874bf;
            color: #ffffff;
            font-size: 13px;
            white-space: nowrap;
        }

        .distance {
            flex-shrink: 0;
            padding-bottom: 2px;
            color: #4869b7;
            font-size: 16px;
            font-weight: 500;
            white-space: nowrap;
        }

        /* 하단 탭바 */
        .bottom-navigation {
            position: fixed;
            left: 0;
            bottom: 0;
            z-index: 100;
            width: 100%;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            background-color: #ffffff;
            border-top: 1px solid #e5e5e5;
        }

        .nav-item {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background-color: transparent;
            color: #171717;
            font-size: 14px;
            cursor: pointer;
        }

        .nav-item img {
            width: 23px;
            height: 23px;
            object-fit: contain;
        }

        .nav-item.active {
            color: #4869b7;
            font-weight: 600;
        }

        /* =========================
           지도 화면
        ========================= */

        .map-screen {
            position: relative;
            display: none;
            width: 100%;
            height: 100svh;
            overflow: hidden;
            background-color: #ffffff;
        }

        .map-screen.active {
            display: block;
        }

        #map {
            width: 100%;
            height: calc(100svh - 164px);
            background-color: #dcefe8;
        }

        .map-back-button {
            position: absolute;
            top: 38px;
            left: 24px;
            z-index: 20;
            width: 36px;
            height: 36px;
            background-color: transparent;
            color: #111111;
            font-size: 31px;
            line-height: 36px;
            cursor: pointer;
        }

        /* 선택된 장소 카드 */
        .selected-card {
            position: absolute;
            left: 0;
            bottom: 0;
            z-index: 30;
            width: 100%;
            min-height: 164px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            padding: 22px 24px;
            background-color: #ffffff;
            border: 1px solid #68d3e7;
        }

        .selected-image {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
        }

        .selected-information {
            flex: 1;
            min-width: 0;
            min-height: 116px;
            display: flex;
            flex-direction: column;
        }

        .selected-name-row {
            width: 100%;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .selected-name {
            flex: 1;
            min-width: 0;
            font-size: 17px;
            font-weight: 500;
            line-height: 1.3;
            word-break: keep-all;
        }

        .selected-save-icon {
            flex-shrink: 0;
            width: 20px;
            height: 20px;
            object-fit: contain;
        }

        .selected-address {
            margin-top: 3px;
            font-size: 13px;
            line-height: 1.4;
            word-break: keep-all;
        }

        .selected-bottom {
            width: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 8px;
            margin-top: auto;
        }

        .selected-distance {
            flex-shrink: 0;
            padding-bottom: 2px;
            color: #4869b7;
            font-size: 16px;
            font-weight: 500;
            white-space: nowrap;
        }

        /* 길찾기 버튼 */
        .route-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 25px;
            padding: 0 9px;
            border-radius: 8px;
            background-color: #5874bf;
            color: #ffffff;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }

        .route-button:active {
            opacity: 0.8;
        }

        /* 위치 확인 안내 */
        .location-message {
            position: fixed;
            left: 50%;
            bottom: 184px;
            z-index: 200;
            width: calc(100% - 48px);
            max-width: 420px;
            padding: 12px 16px;
            border-radius: 10px;
            background-color: rgba(31, 31, 31, 0.88);
            color: #ffffff;
            font-size: 13px;
            line-height: 1.4;
            text-align: center;
            transform: translateX(-50%);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
        }

        .location-message.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>

<body>
    <main class="app">

        <!-- 검색 결과 화면 -->
        <section class="search-screen" id="searchScreen">

            <header class="top-bar">

                        <span class="place-information">
                            <span class="place-name-row">
                                <span class="place-name">
                                    광교호수공원
                                </span>

                                <img
                                    src="./icons/save.svg"

                                <span class="tag-area">

                                </span>

                            </span>

                </li>

                <li class="place-item">
                    <button

                        class="place-button"

                    >
                        <img
                            src="./images/main-2.png"
                            alt="강릉 안반데기 전경"

                        >

                        <span class="place-information">
                            <span class="place-name-row">
                                <span class="place-name">
                                    강릉 안반데기
                                </span>

                                <img
                                    src="./icons/save.svg"
                                    alt="강릉 안반데기 북마크"
                                    class="save-icon"
                                >
                            </span>

                            <span class="place-address">
                                강원도 강릉시 왕산면 대기리 2214-207
                            </span>

                            <span class="place-bottom">
                                <span class="tag-area">
                                    <span class="tag">자연</span>
                                    <span class="tag">주차장</span>
                                </span>

                                <span class="distance">108km</span>
                            </span>
                        </span>
                    </button>
                </li>

                <li class="place-item">

                    >
                        <img
                            src="./images/main-3.png"
                            alt="화성 궁평항 전경"
                            class="place-image"
                        >

                        <span class="place-information">
                            <span class="place-name-row">
                                <span class="place-name">
                                    화성 궁평항
                                </span>

                                <img
                                    src="./icons/save.svg"
                                    alt="화성 궁평항 북마크"
                                    class="save-icon"
                                >
                            </span>

                            <span class="place-address">
                                경기도 화성시 서신면 궁평항로 1049-24

                    type="button"
                    class="nav-item"

                type="button"
                class="map-back-button"

            >

                            class="selected-name"
                            id="selectedName"

            <p
                class="location-message"
                id="locationMessage"
                role="status"
                aria-live="polite"

        /* 캠핑 장소 데이터 */
        const places = [
            {
                name: "망원한강공원",
                address: "서울 마포구 망원동 205-4",
                image: "./images/main.png",
                tags: ["차크닉", "주차장"],
                distance: "11.1km",
                latitude: 37.555558,
                longitude: 126.895232
            },
            {
                name: "광교호수공원",
                address: "경기도 수원시 영통구 광교호수로 165",

                tags: ["도심", "주차장"],
                distance: "26km",
                latitude: 37.283932,

            {

                address: "강원도 강릉시 왕산면 대기리 2214-207",

                tags: ["자연", "주차장"],
                distance: "108km",
                latitude: 37.6228,
                longitude: 128.7395
            },
            {
                name: "화성 궁평항",
                address: "경기도 화성시 서신면 궁평항로 1049-24",
                image: "./images/main-3.png",
                tags: ["차크닉", "주차장"],
                distance: "58km",
                latitude: 37.115171,
                longitude: 126.678055
            },
            {
                name: "서귀포 돈내코",
                address: "제주특별자치도 서귀포시 돈내코로 114",
                image: "./images/main-4.png",
                tags: ["이색", "주차장"],
                distance: "483km",
                latitude: 33.300243,
                longitude: 126.58146
            },
            {
                name: "영종도 마시안해변",

        const searchScreen =
            document.getElementById("searchScreen");

        const mapScreen =
            document.getElementById("mapScreen");

        const mapBackButton =
            document.getElementById("mapBackButton");

        const placeButtons =
            document.querySelectorAll(".place-button");

        const selectedImage =
            document.getElementById("selectedImage");

        const selectedName =
            document.getElementById("selectedName");

        const selectedAddress =
            document.getElementById("selectedAddress");

        const selectedTags =
            document.getElementById("selectedTags");

        const selectedDistance =
            document.getElementById("selectedDistance");

        const routeButton =
            document.getElementById("routeButton");

        const locationMessage =
            document.getElementById("locationMessage");

        let map = null;
        let marker = null;
        let selectedPlace = places[0];
        let messageTimer = null;

        /* 안내 메시지 표시 */
        function showMessage(message) {
            locationMessage.textContent = message;
            locationMessage.classList.add("show");

            clearTimeout(messageTimer);

            messageTimer = setTimeout(function () {
                locationMessage.classList.remove("show");
            }, 2500);
        }

        /* 카카오맵 생성 */
        function createMap(place) {
            if (
                typeof kakao === "undefined" ||
                !kakao.maps
            ) {
                showMessage(
                    "카카오맵을 불러오지 못했습니다. API 키를 확인해주세요."
                );
                return;
            }

            const mapContainer =
                document.getElementById("map");

            const placePosition =
                new kakao.maps.LatLng(
                    place.latitude,
                    place.longitude
                );

            if (!map) {
                const mapOptions = {
                    center: placePosition,
                    level: 4
                };

                map = new kakao.maps.Map(
                    mapContainer,
                    mapOptions
                );

                marker = new kakao.maps.Marker({
                    position: placePosition
                });

                marker.setMap(map);
            } else {
                map.setCenter(placePosition);
                marker.setPosition(placePosition);
            }

            setTimeout(function () {
                map.relayout();
                map.setCenter(placePosition);
            }, 100);
        }

        /* 선택 장소 카드 변경 */
        function changeSelectedPlace(place) {
            selectedImage.src = place.image;
            selectedImage.alt = place.name + " 전경";

            selectedName.textContent = place.name;
            selectedAddress.textContent = place.address;
            selectedDistance.textContent = place.distance;

            selectedTags.innerHTML = "";

            place.tags.forEach(function (tagText) {
                const tag =
                    document.createElement("span");

                tag.className = "tag";
                tag.textContent = tagText;

                selectedTags.appendChild(tag);
            });

            selectedTags.appendChild(routeButton);

            routeButton.setAttribute(
                "aria-label",
                "현재 위치에서 " +
                place.name +
                "까지 길찾기"
            );
        }

        /* 지도 화면 열기 */
        function openMap(index) {
            selectedPlace = places[index];

            changeSelectedPlace(selectedPlace);

            searchScreen.classList.add("hidden");
            mapScreen.classList.add("active");

            createMap(selectedPlace);
        }

        /* 검색 목록 클릭 */
        placeButtons.forEach(function (button) {
            button.addEventListener(
                "click",
                function () {
                    const index =
                        Number(button.dataset.index);

                    openMap(index);
                }
            );
        });

        /* 지도 화면 뒤로가기 */
        mapBackButton.addEventListener(
            "click",
            function () {
                mapScreen.classList.remove("active");
                searchScreen.classList.remove("hidden");
            }
        );

        /* 목적지만 지정한 카카오맵 열기 */
        function openDestinationOnly(place) {
            const destinationName =
                encodeURIComponent(place.name);

            const destinationUrl =
                "https://map.kakao.com/link/to/" +
                destinationName +
                "," +
                place.latitude +
                "," +
                place.longitude;

            window.location.href = destinationUrl;
        }

        /* 현재 위치에서 목적지까지 길찾기 */
        function openRouteFromCurrentLocation(place) {
            if (!navigator.geolocation) {
                showMessage(
                    "현재 위치 기능을 지원하지 않아 목적지만 표시합니다."
                );

                setTimeout(function () {
                    openDestinationOnly(place);
                }, 900);

                return;
            }

            showMessage("현재 위치를 확인하고 있습니다.");

            navigator.geolocation.getCurrentPosition(
                function (position) {
                    const currentLatitude =
                        position.coords.latitude;

                    const currentLongitude =
                        position.coords.longitude;

                    const startName =
                        encodeURIComponent("현재 위치");

                    const destinationName =
                        encodeURIComponent(place.name);

                    const routeUrl =
                        "https://map.kakao.com/link/from/" +
                        startName +
                        "," +
                        currentLatitude +
                        "," +
                        currentLongitude +
                        "/to/" +
                        destinationName +
                        "," +
                        place.latitude +
                        "," +
                        place.longitude;

                    window.location.href = routeUrl;
                },

                function () {
                    showMessage(
                        "현재 위치를 확인할 수 없어 목적지만 표시합니다."
                    );

                    setTimeout(function () {
                        openDestinationOnly(place);
                    }, 1000);
                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 60000
                }
            );
        }

        /* 길찾기 버튼 클릭 */
        routeButton.addEventListener(
            "click",
            function (event) {
                event.stopPropagation();

                openRouteFromCurrentLocation(
                    selectedPlace
                );
            }
        );
    </script>
</body>
</html>
