<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>애국가</title>
    <style>
        *{padding: 0; margin: 0;}
        /* 약식코딩 border : 선두께 색 선종류 */
        div{border: 5px #000000 solid;
            /* 박스 가로 */
        width: 510px;
        /* 박스 배경색 */
        background-color: #fea500;
        /* 박스안쪽 패딩 */
        padding: 16px; 
        /* 박스 사이 간격 */
        margin-bottom: 24px;
    }
    </style>
</head>
<body>
    <div>
        <h1>애국가</h1>
    </div>

    <div>
        <p>동해물과 백두산이 마르고 닳도도록<br>
            하느님이 보우하사 우리나라만세<br>
            무궁화 삼천리 화려강산<br>
            대한사람 대한으로 길이보전하세
        </p>
    </div>
</body>
</html>
