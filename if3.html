<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // 신입사원 입사점수를 웹으로부터 입력받아 90점이상이면 기획팀
        // 80점이상이면 총무팀
        // 나머지는 모두 영업팀

        let jumsn= prompt("입사점수를 입력하세요")
        if(jumsn>=90){
            alert("발령부서:기획팀")
        }else if(jumsn>=80){
            alert("발령부서:총무팀")
        }else{
            alert("발령부서:영업팀")
        }


    </script>
</body>
</html>
