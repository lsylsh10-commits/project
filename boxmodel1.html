<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스모델1</title>
    <style>
      .box{ 
        width: 1000px;
        height: 500px;
        border: 5px solid #0000fe;
        margin: 0 auto; 
        display: flex;
        gap: 20px;
      }
      .box .box1{
        width: 300px;
        height: 200px;
        border: 4px #000000 solid;
      }
      .box .box2{
        width: 300px;
        height: 200px;
        border: 4px #000000 solid;
      }
      .box .box3{
        width: 300px;
        height: 200px;
        border: 4px #000000 solid;
      }
    </style>
</head>
<body>
    <div class="box">
        <div class="box1">배너1</div>
        <div class="box2">배너2</div>
        <div class="box3">배너3</div>
    </div>
</body>
</html>
