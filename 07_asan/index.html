<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일아산병원</title>

    <!-- swiper 슬라이드 css(내가 만든거 위에) -->
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"
/>

    <!-- 내가 만든 css(항상 아래) -->
    <link rel="stylesheet" href="./css/main.css">
</head>

<body>
    <div id="header">
        <button><img src="./images/bg_header_lnb.png" alt="메뉴 버튼"></button>
           <h1>
            <a href="./index.html">
            <img src="./images/asan_logo.png" alt="아산병원 로고"></a>
        </h1>
        <button><img src="./images/img_topSerch.png" alt="검색 버튼"></button>
    </div>

    <!-- 스와이퍼 슬라이드 박스 -->
    <!-- Slider main container -->
    <div class="swiper">
    <!-- Additional required wrapper -->
    <div class="swiper-wrapper">
    <!-- Slides -->
    <div class="swiper-slide"><img src="./images/main_visual_640.png" alt="메인배너 이미지"></div>
    <div class="swiper-slide"><img src="./images/main_visual_newsweek.png" alt="메인배너 이미지2"></div>
    <div class="swiper-slide"><img src="./images/main_visual_3.png" alt="메인배너 이미지3"></div>
    
    </div>
    <!-- If we need pagination 페이지 버튼-->
   <div class="swiper-pagination"></div>

    <!-- If we need navigation buttons -->
     <div class="swiper-button-prev"></div>
    <div class="swiper-button-next"></div>

    <!-- If we need scrollbar -->
     <!-- <div class="swiper-scrollbar"></div> -->
    </div>

    <!-- swiper 슬라이드 자바스크립트(내가 만든거 위에) -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    
    <!-- 내가 만든 자바스크립트(항상 아래) -->
    <script src="./js/main.js"></script>
</body>
</html>
