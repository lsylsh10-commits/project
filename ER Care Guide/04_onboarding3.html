<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ER 안심가이드 - 온보딩 3</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background-color: #ffffff;
      font-family: "Pretendard", sans-serif;
      color: #0f1e2e;
    }

    .app {
      width: 100%;
      height: 100svh;
      overflow: hidden;
      background-color: #ffffff;
    }

    .onboarding {
      width: 100%;
      height: 100%;
      padding: 64px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .indicator {
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 76px;
    }

    .indicator span {
      width: 8px;
      height: 8px;
      display: block;
      border-radius: 50%;
      background-color: #e2e8f0;
    }

    .indicator .active {
      background-color: #0d6e7a;
    }

    .text-area {
      width: 100%;
      text-align: center;
    }

    .title {
      font-size: 22px;
      line-height: 30px;
      font-weight: 700;
      color: #0f1e2e;
      word-break: keep-all;
    }

    .description {
      margin-top: 18px;
      font-size: 14px;
      line-height: 22px;
      font-weight: 400;
      color: #64748b;
      word-break: keep-all;
    }

    .illustration-area {
      width: 250px;
      height: 108px;
      margin-top: 20px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      overflow: hidden;
    }

    .illustration {
      width: 250px;
      height: auto;
      display: block;
    }

    .content-area {
      width: 100%;
      margin-top: -2px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      width: 100%;
      padding: 16px 22px;
      border: 1px solid #dbe3eb;
      border-radius: 8px;
      background-color: #ffffff;
    }

    .card-title {
      font-size: 16px;
      line-height: 22px;
      font-weight: 700;
      color: #0f1e2e;
    }

    .alert-content {
      margin-top: 16px;
      display: flex;
      align-items: center;
    }

    .alert-icon {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      display: block;
    }

    .alert-text {
      flex: 1;
      margin-left: 16px;
      font-size: 14px;
      line-height: 22px;
      color: #64748b;
      word-break: keep-all;
    }

    .alert-time {
      align-self: flex-start;
      margin-left: 12px;
      font-size: 14px;
      line-height: 22px;
      color: #64748b;
    }

    .todo-list {
      margin-top: 12px;
    }

    .todo-item {
      min-height: 38px;
      display: flex;
      align-items: center;
    }

    .todo-item + .todo-item {
      border-top: 1px solid #e2e8f0;
    }

    .check-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: block;
    }

    .todo-text {
      flex: 1;
      margin-left: 10px;
      font-size: 14px;
      line-height: 20px;
      color: #64748b;
    }

    .next-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: block;
    }

    .button-area {
      width: 100%;
      margin-top: 26px;
    }

    .start-button {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background-color: #0d7c87;
      color: #ffffff;
      font-size: 16px;
      line-height: 20px;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="onboarding">

      <div class="indicator" aria-label="온보딩 3단계">
        <span></span>
        <span></span>
        <span class="active"></span>
      </div>

      <div class="text-area">
        <h1 class="title">
          필요한 알림과<br>
          보호자 행동을 안내해드려요
        </h1>

        <p class="description">
          중요한 알림을 놓치지 않고,<br>
          지금 할 일을 쉽게 확인할 수 있어요.
        </p>
      </div>

      <div class="illustration-area">
        <img
          src="./images/onboard3_ill.png"
          alt="응급실 알림을 확인하는 휴대폰"
          class="illustration"
        >
      </div>

      <div class="content-area">

        <section class="card">
          <h2 class="card-title">알림 예시</h2>

          <div class="alert-content">
            <img
              src="./icons/bell_blue.svg"
              alt=""
              class="alert-icon"
            >

            <p class="alert-text">
              검사 순서가 곧 다가옵니다.<br>
              10분 후 안내가 시작됩니다.
            </p>

            <time class="alert-time">09:35</time>
          </div>
        </section>

        <section class="card">
          <h2 class="card-title">지금 할 일</h2>

          <div class="todo-list">

            <div class="todo-item">
              <img
                src="./icons/check_blue_active.svg"
                alt=""
                class="check-icon"
              >

              <span class="todo-text">
                문진표 작성하기
              </span>

              <img
                src="./icons/next.svg"
                alt=""
                class="next-icon"
              >
            </div>

            <div class="todo-item">
              <img
                src="./icons/check_blue.svg"
                alt=""
                class="check-icon"
              >

              <span class="todo-text">
                보호 정보 확인하기
              </span>

              <img
                src="./icons/next.svg"
                alt=""
                class="next-icon"
              >
            </div>

          </div>
        </section>

      </div>

      <div class="button-area">
        <a href="05_login.html" class="start-button">
          시작하기
        </a>
      </div>

    </section>
  </main>

  <script>
    setTimeout(function () {
      location.href = "05_login.html";
    }, 10000);
  </script>
</body>
</html>
