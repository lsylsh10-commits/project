<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ER 안심가이드</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background-color: #f2f6fa;
      font-family: "Pretendard", sans-serif;
    }

    .app {
      width: 100%;
      height: 100svh;
      position: relative;
      overflow: hidden;

      background-image: url("./images/splash.png");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
    }

    .logo {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 180px;
      height: auto;
      transform: translate(-50%, -50%);
      display: block;
    }
  </style>
</head>

<body>
  <main class="app" aria-label="ER 안심가이드 시작 화면">
    <img
      src="./images/logo.png"
      alt="ER 안심가이드 로고"
      class="logo"
    >
  </main>

  <script>
    setTimeout(function () {
      location.href = "02_onboarding1.html";
    }, 10000);
  </script>
</body>
</html>
