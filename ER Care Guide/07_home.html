<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ER 안심가이드 - 홈</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background-color: #f2f6fa;
      font-family: "Pretendard", sans-serif;
      color: #0f1e2e;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      width: 100%;
      height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #f2f6fa;
    }

    .content {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 48px 20px 24px;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    .top-area {
      width: 100%;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .welcome-text {
      font-size: 20px;
      line-height: 28px;
      font-weight: 700;
      color: #0f1e2e;
    }

    .notification-button {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notification-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .card-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      width: 100%;
      border: 1px solid #dbe3eb;
      border-radius: 10px;
      background-color: #ffffff;
      overflow: hidden;
    }

    .card-title {
      font-size: 18px;
      line-height: 26px;
      font-weight: 700;
      color: #0f1e2e;
    }

    .patient-card {
      padding: 16px;
    }

    .patient-card-header {
      width: 100%;
      display: block;
    }

    .patient-info {
      width: 100%;
      margin-top: 16px;
      display: flex;
      align-items: center;
    }

    .patient-profile {
      width: 52px;
      height: 52px;
      flex-shrink: 0;
      display: block;
    }

    .patient-detail {
      flex: 1;
      min-width: 0;
      margin-left: 14px;
    }

    .patient-name {
      font-size: 16px;
      line-height: 22px;
      font-weight: 700;
      color: #0f1e2e;
    }

    .patient-number {
      margin-top: 4px;
      font-size: 13px;
      line-height: 20px;
      color: #64748b;
      white-space: nowrap;
    }

    .change-button {
      min-width: 72px;
      height: 32px;
      margin-left: 10px;
      padding: 0 12px;
      border: 1px solid #168ba0;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      line-height: 18px;
      font-weight: 500;
      color: #168ba0;
      background-color: #ffffff;
      flex-shrink: 0;
    }

    .progress-card {
      display: block;
      padding: 16px 16px 18px;
    }

    .progress-stepper {
      width: 100%;
      margin-top: 18px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .step {
      width: 20%;
      position: relative;
      text-align: center;
    }

    .step:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 12px;
      left: calc(50% + 13px);
      width: calc(100% - 26px);
      height: 1px;
      background-color: #7a8ca5;
    }

    .step-icon {
      width: 26px;
      height: 26px;
      position: relative;
      z-index: 1;
      display: block;
      margin: 0 auto;
      background-color: #ffffff;
    }

    .step-label {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      line-height: 16px;
      color: #64748b;
    }

    .step.current .step-label {
      color: #168ba0;
      font-weight: 600;
    }

    .waiting-card {
      display: block;
      padding: 16px;
    }

    .waiting-layout {
      width: 100%;
      display: flex;
    }

    .waiting-left,
    .waiting-right {
      width: 50%;
    }

    .waiting-left {
      padding-right: 14px;
      border-right: 1px solid #dbe3eb;
    }

    .waiting-right {
      padding-left: 14px;
    }

    .waiting-time {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-icon {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      display: block;
    }

    .time-value {
      font-size: 24px;
      line-height: 32px;
      font-weight: 700;
      color: #0f1e2e;
      white-space: nowrap;
    }

    .update-text {
      margin-top: 6px;
      padding-left: 48px;
      font-size: 12px;
      line-height: 18px;
      color: #64748b;
      white-space: nowrap;
    }

    .delay-title {
      font-size: 17px;
      line-height: 26px;
      font-weight: 700;
      color: #71829b;
    }

    .delay-text {
      margin-top: 10px;
      font-size: 13px;
      line-height: 21px;
      color: #71829b;
      word-break: keep-all;
    }

    .todo-card {
      display: block;
      padding: 16px;
    }

    .todo-list {
      margin-top: 12px;
    }

    .todo-item {
      min-height: 40px;
      display: flex;
      align-items: center;
    }

    .todo-item + .todo-item {
      border-top: 1px solid #e2e8f0;
    }

    .todo-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: block;
    }

    .todo-text {
      flex: 1;
      margin-left: 10px;
      font-size: 13px;
      line-height: 20px;
      color: #71829b;
    }

    .next-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      display: block;
    }

    .recent-card {
      display: block;
      padding: 16px;
    }

    .recent-content {
      margin-top: 12px;
      min-height: 36px;
      display: flex;
      align-items: center;
    }

    .recent-icon {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      display: block;
    }

    .recent-text {
      flex: 1;
      margin-left: 12px;
      font-size: 13px;
      line-height: 20px;
      color: #71829b;
    }

    .recent-time {
      margin-left: 8px;
      font-size: 13px;
      line-height: 20px;
      color: #71829b;
      white-space: nowrap;
    }

    .recent-next {
      width: 16px;
      height: 16px;
      margin-left: 6px;
      display: block;
    }

    .bottom-tab-bar {
      width: 100%;
      height: 72px;
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      border-top: 1px solid #dbe3eb;
      background-color: #ffffff;
    }

    .tab-item {
      width: 25%;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .tab-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .tab-label {
      font-size: 11px;
      line-height: 14px;
      font-weight: 500;
      color: #71829b;
    }

    .tab-item.active .tab-label {
      color: #0d6e7a;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="app">

    <section class="content">

      <header class="top-area">
        <h1 class="welcome-text">
          박수영님, 안녕하세요!
        </h1>

        <a
          href="11_notifications.html"
          class="notification-button"
          aria-label="알림 화면으로 이동"
        >
          <img
            src="./icons/bell_black.svg"
            alt=""
            class="notification-icon"
          >
        </a>
      </header>

      <div class="card-list">

        <section class="card patient-card">
          <a
            href="17_more.html"
            class="patient-card-header"
            aria-label="더보기 화면으로 이동"
          >
            <h2 class="card-title">환자 정보</h2>
          </a>

          <div class="patient-info">
            <a
              href="17_more.html"
              aria-label="환자 정보 자세히 보기"
            >
              <img
                src="./icons/profile_m.svg"
                alt="김민준 환자 프로필"
                class="patient-profile"
              >
            </a>

            <a
              href="17_more.html"
              class="patient-detail"
              aria-label="환자 정보 자세히 보기"
            >
              <p class="patient-name">김민준 (남, 12세)</p>
              <p class="patient-number">
                접수번호　2024-0501-0001
              </p>
            </a>

            <a
              href="06_patient_selection.html"
              class="change-button"
            >
              환자 변경
            </a>
          </div>
        </section>

        <a
          href="09_progress_status.html"
          class="card progress-card"
        >
          <h2 class="card-title">진료 진행상황</h2>

          <div class="progress-stepper">

            <div class="step">
              <img
                src="./icons/document_circle_line.svg"
                alt=""
                class="step-icon"
              >
              <span class="step-label">접수</span>
            </div>

            <div class="step current">
              <img
                src="./icons/check_circle_blue.svg"
                alt=""
                class="step-icon"
              >
              <span class="step-label">진료</span>
            </div>

            <div class="step">
              <img
                src="./icons/document_circle_line.svg"
                alt=""
                class="step-icon"
              >
              <span class="step-label">검사</span>
            </div>

            <div class="step">
              <img
                src="./icons/document_circle_line.svg"
                alt=""
                class="step-icon"
              >
              <span class="step-label">결과확인</span>
            </div>

            <div class="step">
              <img
                src="./icons/document_circle_line.svg"
                alt=""
                class="step-icon"
              >
              <span class="step-label">수납</span>
            </div>

          </div>
        </a>

        <a
          href="08_expected_wait_time.html"
          class="card waiting-card"
        >
          <div class="waiting-layout">

            <div class="waiting-left">
              <h2 class="card-title">예상 대기시간</h2>

              <div class="waiting-time">
                <img
                  src="./icons/time_green.svg"
                  alt=""
                  class="time-icon"
                >

                <p class="time-value">1시간 25분</p>
              </div>

              <p class="update-text">
                업데이트 09:41
              </p>
            </div>

            <div class="waiting-right">
              <h2 class="delay-title">지연 사유</h2>

              <p class="delay-text">
                응급 환자 발생 증가로<br>
                인해 대기시간이 길어<br>
                지고 있어요.
              </p>
            </div>

          </div>
        </a>

        <a
          href="10_progress_detail.html"
          class="card todo-card"
        >
          <h2 class="card-title">지금 할 일</h2>

          <div class="todo-list">

            <div class="todo-item">
              <img
                src="./icons/check_blue_active.svg"
                alt=""
                class="todo-icon"
              >

              <span class="todo-text">
                문진표 작성하기
              </span>

              <img
                src="./icons/next.svg"
                alt=""
                class="next-icon"
              >
            </div>

            <div class="todo-item">
              <img
                src="./icons/check_blue_active.svg"
                alt=""
                class="todo-icon"
              >

              <span class="todo-text">
                보호 정보 확인하기
              </span>

              <img
                src="./icons/next.svg"
                alt=""
                class="next-icon"
              >
            </div>

          </div>
        </a>

        <a
          href="11_notifications.html"
          class="card recent-card"
        >
          <h2 class="card-title">최근 알림</h2>

          <div class="recent-content">
            <img
              src="./icons/bell_blue.svg"
              alt=""
              class="recent-icon"
            >

            <p class="recent-text">
              검사 순서가 곧 다가옵니다.
            </p>

            <time class="recent-time">
              09:35
            </time>

            <img
              src="./icons/next.svg"
              alt=""
              class="recent-next"
            >
          </div>
        </a>

      </div>

    </section>

    <nav class="bottom-tab-bar" aria-label="하단 메뉴">

      <a
        href="07_home.html"
        class="tab-item active"
      >
        <img
          src="./icons/tap_home_active.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">홈</span>
      </a>

      <a
        href="09_progress_status.html"
        class="tab-item"
      >
        <img
          src="./icons/tap_check.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">진행상황</span>
      </a>

      <a
        href="11_notifications.html"
        class="tab-item"
      >
        <img
          src="./icons/tap_bell.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">알림</span>
      </a>

      <a
        href="17_more.html"
        class="tab-item"
      >
        <img
          src="./icons/tap_menu.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">더보기</span>
      </a>

    </nav>

  </main>
</body>
</html>
