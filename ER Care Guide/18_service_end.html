<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ER 안심가이드 - 서비스 종료하기</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background-color: #ffffff;
      font-family: "Pretendard", sans-serif;
      color: #0f1e2e;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      width: 100%;
      height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: #ffffff;
    }

    /* 상단 네비게이션 */
    .app-bar {
      width: 100%;
      height: 112px;
      flex-shrink: 0;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding: 0 20px 24px;
      background-color: #ffffff;
    }

    .back-button {
      width: 44px;
      height: 44px;
      position: absolute;
      left: 10px;
      bottom: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .page-title {
      font-size: 22px;
      line-height: 30px;
      font-weight: 700;
      color: #0f1e2e;
    }

    /* 스크롤 영역 */
    .content {
      width: 100%;
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 20px 20px;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    .content-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 상단 안내 */
    .intro-section {
      width: 100%;
      min-height: 130px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .intro-text-area {
      flex: 1;
      min-width: 0;
      padding-right: 12px;
    }

    .intro-title {
      font-size: 18px;
      line-height: 27px;
      font-weight: 700;
      color: #0f1e2e;
      word-break: keep-all;
    }

    .intro-description {
      margin-top: 10px;
      font-size: 14px;
      line-height: 22px;
      color: #71829b;
      word-break: keep-all;
    }

    .end-illustration {
      width: 116px;
      height: auto;
      flex-shrink: 0;
      display: block;
    }

    /* 확인 목록 카드 */
    .check-card {
      width: 100%;
      padding: 4px 16px;
      border: 1px solid #dbe3eb;
      border-radius: 9px;
      background-color: #ffffff;
    }

    .check-item {
      width: 100%;
      min-height: 86px;
      display: flex;
      align-items: center;
    }

    .check-item + .check-item {
      border-top: 1px solid #dbe3eb;
    }

    .item-icon {
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      display: block;
    }

    .item-text-area {
      flex: 1;
      min-width: 0;
      margin-left: 12px;
    }

    .item-title {
      font-size: 15px;
      line-height: 22px;
      font-weight: 700;
      color: #0f1e2e;
    }

    .item-description {
      margin-top: 2px;
      font-size: 12px;
      line-height: 18px;
      color: #71829b;
      word-break: keep-all;
    }

    .complete-icon {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
      margin-left: 12px;
      display: block;
    }

    /* 서비스 종료 버튼 */
    .end-button {
      width: 100%;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background-color: #117d88;
      color: #ffffff;
      font-size: 15px;
      line-height: 20px;
      font-weight: 600;
    }

    /* 공통 하단 탭바 */
    .bottom-tab-bar {
      width: 100%;
      height: 72px;
      flex-shrink: 0;
      display: flex;
      align-items: stretch;
      border-top: 1px solid #dbe3eb;
      background-color: #ffffff;
    }

    .tab-item {
      width: 25%;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .tab-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .tab-label {
      font-size: 11px;
      line-height: 14px;
      font-weight: 500;
      color: #71829b;
    }

    .tab-item.active .tab-label {
      color: #0d6e7a;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="app">

    <header class="app-bar">
      <a
        href="17_more.html"
        class="back-button"
        aria-label="이전 화면으로 이동"
      >
        <img
          src="./icons/back.svg"
          alt=""
          class="back-icon"
        >
      </a>

      <h1 class="page-title">서비스 종료하기</h1>
    </header>

    <section class="content">

      <div class="content-list">

        <section class="intro-section">
          <div class="intro-text-area">
            <h2 class="intro-title">
              모든 절차가 완료되었는지<br>
              확인해 주세요.
            </h2>

            <p class="intro-description">
              아래 항목을 체크하시면<br>
              안내를 마무리할 수 있어요.
            </p>
          </div>

          <img
            src="./images/service_ent_ill.png"
            alt="응급실 이용 절차 완료 안내"
            class="end-illustration"
          >
        </section>

        <section class="check-card">

          <div class="check-item">
            <img
              src="./icons/card.svg"
              alt=""
              class="item-icon"
            >

            <div class="item-text-area">
              <h3 class="item-title">수납 완료</h3>

              <p class="item-description">
                모든 수납이 완료되었어요.
              </p>
            </div>

            <img
              src="./icons/check_green_active.svg"
              alt="완료"
              class="complete-icon"
            >
          </div>

          <div class="check-item">
            <img
              src="./icons/document_pen_green.svg"
              alt=""
              class="item-icon"
            >

            <div class="item-text-area">
              <h3 class="item-title">처방전 확인</h3>

              <p class="item-description">
                처방전과 복약 안내를 받았어요.
              </p>
            </div>

            <img
              src="./icons/check_green_active.svg"
              alt="완료"
              class="complete-icon"
            >
          </div>

          <div class="check-item">
            <img
              src="./icons/document_green.svg"
              alt=""
              class="item-icon"
            >

            <div class="item-text-area">
              <h3 class="item-title">수납 완료</h3>

              <p class="item-description">
                필요한 서류를 발급 받았거나<br>
                발급 계획이 있어요.
              </p>
            </div>

            <img
              src="./icons/check_green_active.svg"
              alt="완료"
              class="complete-icon"
            >
          </div>

          <div class="check-item">
            <img
              src="./icons/home_green.svg"
              alt=""
              class="item-icon"
            >

            <div class="item-text-area">
              <h3 class="item-title">귀가 안내</h3>

              <p class="item-description">
                귀가 방법과 주의사항을 확인했어요.
              </p>
            </div>

            <img
              src="./icons/check_green_active.svg"
              alt="완료"
              class="complete-icon"
            >
          </div>

        </section>

        <a
          href="19_service_complete.html"
          class="end-button"
        >
          서비스 종료하기
        </a>

      </div>

    </section>

    <nav class="bottom-tab-bar" aria-label="하단 메뉴">

      <a
        href="07_home.html"
        class="tab-item"
      >
        <img
          src="./icons/tap_home.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">홈</span>
      </a>

      <a
        href="09_progress_status.html"
        class="tab-item"
      >
        <img
          src="./icons/tap_check.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">진행상황</span>
      </a>

      <a
        href="11_notifications.html"
        class="tab-item"
      >
        <img
          src="./icons/tap_bell.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">알림</span>
      </a>

      <a
        href="17_more.html"
        class="tab-item active"
      >
        <img
          src="./icons/tap_menu_active.svg"
          alt=""
          class="tab-icon"
        >
        <span class="tab-label">더보기</span>
      </a>

    </nav>

  </main>
</body>
</html>
