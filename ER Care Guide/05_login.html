<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>ER 안심가이드 - 로그인</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
      background-color: #ffffff;
      font-family: "Pretendard", sans-serif;
      color: #0f1e2e;
    }

    input,
    button {
      font-family: "Pretendard", sans-serif;
    }

    .app {
      width: 100%;
      height: 100svh;
      overflow: hidden;
      background-color: #ffffff;
    }

    .login-page {
      width: 100%;
      height: 100%;
      padding: 0 20px;
    }

    .app-bar {
      width: 100%;
      height: 128px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .back-button {
      width: 44px;
      height: 44px;
      position: absolute;
      left: -10px;
      top: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .back-icon {
      width: 24px;
      height: 24px;
      display: block;
    }

    .page-title {
      margin-top: 6px;
      font-size: 22px;
      line-height: 30px;
      font-weight: 700;
      color: #0f1e2e;
    }

    .guide-text {
      margin-top: 44px;
      font-size: 14px;
      line-height: 22px;
      font-weight: 400;
      text-align: center;
      color: #71829b;
    }

    .login-form {
      width: 100%;
      margin-top: 48px;
    }

    .form-group + .form-group {
      margin-top: 32px;
    }

    .input-label {
      display: block;
      margin-bottom: 8px;
      font-size: 15px;
      line-height: 22px;
      font-weight: 600;
      color: #0f1e2e;
    }

    .input-box {
      width: 100%;
      height: 52px;
      padding: 0 18px;
      border: 1px solid #dbe3eb;
      border-radius: 8px;
      outline: none;
      background-color: #ffffff;
      font-size: 16px;
      line-height: 52px;
      color: #0f1e2e;
    }

    .input-box::placeholder {
      color: #cbd5e1;
    }

    .input-box:focus {
      border-color: #0d6e7a;
    }

    .verification-button {
      width: 100%;
      height: 52px;
      margin-top: 8px;
      border: 0;
      border-radius: 8px;
      background-color: #117d88;
      color: #ffffff;
      font-size: 16px;
      line-height: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .verification-input-wrap {
      width: 100%;
      height: 52px;
      position: relative;
    }

    .verification-input {
      padding-right: 76px;
    }

    .timer {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 14px;
      line-height: 20px;
      font-weight: 600;
      color: #71829b;
    }

    .login-button {
      width: 100%;
      height: 52px;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      background-color: #117d88;
      color: #ffffff;
      font-size: 16px;
      line-height: 20px;
      font-weight: 600;
      text-decoration: none;
    }

    .security-guide {
      width: 100%;
      margin-top: 46px;
      display: flex;
      align-items: flex-start;
      padding: 0 4px;
    }

    .lock-icon {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
      margin-top: 1px;
      display: block;
    }

    .security-text {
      margin-left: 10px;
      font-size: 14px;
      line-height: 21px;
      font-weight: 400;
      color: #71829b;
      word-break: keep-all;
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="login-page">

      <header class="app-bar">
        <a
          href="04_onboarding3.html"
          class="back-button"
          aria-label="이전 화면으로 이동"
        >
          <img
            src="./icons/back.svg"
            alt=""
            class="back-icon"
          >
        </a>

        <h1 class="page-title">로그인</h1>
      </header>

      <p class="guide-text">
        보호자 본인 인증을 진행해 주세요.
      </p>

      <form class="login-form">

        <div class="form-group">
          <label for="phone" class="input-label">
            휴대폰 번호 입력
          </label>

          <input
            type="tel"
            id="phone"
            class="input-box"
            placeholder="010-1234-5678"
            maxlength="13"
          >

          <button
            type="button"
            class="verification-button"
          >
            본인인증
          </button>
        </div>

        <div class="form-group">
          <label for="verification" class="input-label">
            인증번호 입력
          </label>

          <div class="verification-input-wrap">
            <input
              type="text"
              id="verification"
              class="input-box verification-input"
              placeholder="인증번호 6자리 입력"
              maxlength="6"
            >

            <span class="timer">02:59</span>
          </div>

          <a
            href="06_patient_selection.html"
            class="login-button"
          >
            로그인 하기
          </a>
        </div>

      </form>

      <div class="security-guide">
        <img
          src="./icons/lock.svg"
          alt=""
          class="lock-icon"
        >

        <p class="security-text">
          안심 암호로, 등록된 보호자 연락처와<br>
          이름정보가 확인됩니다.
        </p>
      </div>

    </section>
  </main>
</body>
</html>
